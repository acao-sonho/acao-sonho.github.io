<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#B5653E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Ação Leve 3 Pague 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: barra fixa de busca e leitura no topo, grade de cartões de produto; ao ler um código abre a ficha grande com a borda do status */
:root{
  --bg:#F6EFE6; --card:#FFFDF9; --fg:#3A2418; --soft:#7A5A47; --line:#DCCBB8;
  --brand:#B5653E; --ok:#2E7D3E; --okbg:#E4EEDF; --no:#D3261F; --nobg:#F6DDD4; --zero:#8a7a70;
  --t-display:"Cormorant Garamond",Georgia,serif; --t-body:"Jost","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1510;--card:#2A1E17;--fg:#F3E8DD;--soft:#C2A894;--line:#4A372B;--brand:#D9875C;--ok:#4FB062;--okbg:#1E3322;--no:#FF5146;--nobg:#401C16;--zero:#9C8B80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1510;--card:#2A1E17;--fg:#F3E8DD;--soft:#C2A894;--line:#4A372B;--brand:#D9875C;--ok:#4FB062;--okbg:#1E3322;--no:#FF5146;--nobg:#401C16;--zero:#9C8B80;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--t-body);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
header .wrap>*{min-width:0}
.tit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tit h1{font-family:var(--t-display);font-size:25px;margin:0;font-weight:700;line-height:1.05}
.tit h1 b{color:var(--brand);font-style:italic}
.tit select{margin-left:auto;font:inherit;font-size:14px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
.busca{display:flex;gap:8px}
.busca .btn{padding:10px 12px}
.busca input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 11px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sim[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.nao[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:#fff}
.status{font-size:13px;color:var(--soft);min-height:18px}
.status.err{color:var(--no);font-weight:600}
main .wrap{padding-block:12px 40px}
.resumo{font-size:13px;color:var(--soft);margin:0 0 10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;border:3px solid var(--ok);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0}
.card.fora{border-color:var(--no)}
.card .ft{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.card .ft img{width:100%;height:100%;object-fit:contain}
.card .ft .sf{font-size:12px;color:#999}
.tag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;color:#fff;background:var(--ok);letter-spacing:.02em}
.fora .tag{background:var(--no)}
.zr{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:#3a3a3a;color:#fff}
.card.zerado .ft img{opacity:.45;filter:grayscale(1)}
.card .tx{padding:8px 9px 10px;display:grid;gap:2px}
.card .rf{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.card .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.card .es{font-size:12.5px;font-variant-numeric:tabular-nums}
.card.zerado .es{color:var(--zero);font-weight:700}
.mais{display:block;margin:16px auto 0}
/* ficha do produto lido */
.ficha{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fbox{background:var(--card);border-radius:20px;border:8px solid var(--ok);width:min(440px,100%);max-height:100%;overflow:auto;position:relative}
.fbox.fora{border-color:var(--no);animation:pisca .8s steps(2,start) infinite}
@keyframes pisca{0%{border-color:var(--no);box-shadow:0 0 0 6px rgba(211,34,34,.45)}100%{border-color:transparent;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.fbox.fora{animation:none}}
.faixa{font-family:var(--t-body);font-weight:700;font-size:20px;text-align:center;padding:10px;color:#fff;background:var(--ok);letter-spacing:.02em}
.fora .faixa{background:var(--no)}
.fbox .ft{background:#fff;aspect-ratio:1;display:grid;place-items:center}
.fbox .ft img{width:100%;height:100%;object-fit:contain}
.fbox .tx{padding:14px 16px 18px;display:grid;gap:6px}
.fbox .nm{font-family:var(--t-display);font-size:24px;font-weight:700;line-height:1.1}
.fbox .rf{color:var(--soft);font-size:14px}
.preco{font-size:15px}.preco s{color:var(--soft)}
.est{border-radius:12px;padding:10px 12px;background:var(--okbg);font-size:14px}
.est.zero{background:var(--nobg);color:var(--no);font-weight:800;font-size:16px}
.tams{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px;margin-top:3px}
.fechar{position:absolute;right:10px;top:54px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer}
.outras{font-size:13px;color:var(--soft)}
[hidden]{display:none!important}
.cam{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;align-content:center;gap:14px;color:#fff;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cam video{width:min(560px,100%);max-height:70vh;border-radius:14px;background:#111}
.cam .mira{position:absolute;left:50%;top:50%;width:min(420px,80%);height:90px;transform:translate(-50%,-60%);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.cam p{margin:0;font-size:15px}
.vazio{padding:30px 10px;text-align:center;color:var(--soft)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600;700&display=swap">

</head><body>
<header><div class="wrap">
  <div class="tit"><h1>Ação <b>Leve 3 Pague 2</b></h1>
    <label for="loja" style="position:absolute;left:-9999px">Sua loja</label>
    <select id="loja"><option value="">Escolha sua loja</option></select></div>
  <form class="busca" id="form" autocomplete="off">
    <label for="q" style="position:absolute;left:-9999px">Referência, código de barras ou nome</label>
    <input id="q" type="search" inputmode="search" placeholder="Digite a referência, o código ou o nome">
    <label class="btn" for="file" tabindex="0" role="button">▦ Ler código</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </form>
  <div class="filtros" id="fa">
    <button class="chip" data-a="" aria-pressed="true">Todos</button>
    <button class="chip sim" data-a="1" aria-pressed="false">✓ Pertence à ação</button>
    <button class="chip nao" data-a="0" aria-pressed="false">✕ Não pertence à ação</button>
    <button class="chip" id="soEst" aria-pressed="false">Só com estoque na loja</button>
  </div>
  <div class="filtros" id="fc"></div>
  <div class="status" id="status" role="status"></div>
</div></header>

<main><div class="wrap">
  <p class="resumo" id="resumo">Carregando os produtos…</p>
  <div class="grade" id="grade"></div>
  <button class="btn mais" id="mais" hidden>Mostrar mais</button>
</div></main>

<div class="cam" id="cam" hidden><video id="video" playsinline muted></video><div class="mira"></div><p>Mire no código de barras da etiqueta</p><button class="btn" id="bStop" type="button">Fechar câmera</button></div>
<div class="ficha" id="ficha" hidden><div class="fbox" id="fbox" role="dialog" aria-modal="true" aria-labelledby="fnm"></div></div>

<script>
const $=id=>document.getElementById(id);
let D=null,LOJA='',fA='',fC='',soEst=false,lim=60,lista=[];
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
try{LOJA=localStorage.getItem('acao_loja')||'';}catch(e){}

/* fotos em pacotes, carregadas quando o cartão aparece na tela */
const pk={},pkP={};
function pacote(i){ if(pk[i])return Promise.resolve(pk[i]);
  if(!pkP[i])pkP[i]=fetch('f/p'+i+'.json').then(r=>r.json()).then(j=>pk[i]=j).catch(()=>{pkP[i]=null;return {};});
  return pkP[i]; }
async function foto(ref){ if(!D)return null; const j=await pacote(parseInt(ref,10)%D.np); return j[ref]?'data:image/jpeg;base64,'+j[ref]:null; }
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);pinta(e.target);}})},{rootMargin:'300px'}):null;
async function pinta(box){const r=box.dataset.ref;const src=await foto(r);
  if(src){const im=new Image();im.alt='';im.src=src;box.querySelector('.ph')?.replaceWith(im);} else {const s=box.querySelector('.ph');if(s)s.textContent='sem foto';}}

function estoque(p){ if(!LOJA)return null; const e=p.e[LOJA]; return e?{q:e[0],t:e[1]}:{q:0,t:''}; }
function total(p){let s=0;for(const k in p.e)s+=p.e[k][0];return s;}

function cartao(p){
  const b=document.createElement('button');b.type='button';
  const es=estoque(p),zero=es&&es.q===0;
  b.className='card'+(p.a?'':' fora')+(zero?' zerado':'');
  b.innerHTML=`<div class="ft" data-ref="${p.r}"><span class="ph sf">${p.f?'':'sem foto'}</span><span class="tag">${p.a?'NA AÇÃO':'FORA'}</span>${zero?'<span class="zr">ZERADO</span>':''}</div>
  <div class="tx"><span class="rf">Ref. ${p.r}</span><span class="nm">${p.n||'Produto sem nome no cadastro'}</span>
  <span class="es">${es?(zero?'Zerado na sua loja':es.q+' '+(es.q===1?'peça':'peças')+' na loja'):total(p)+' peças na rede'}</span></div>`;
  b.onclick=()=>abre(p);
  const ft=b.querySelector('.ft'); if(p.f){ if(io)io.observe(ft); else pinta(ft);}
  return b;
}
function casa(p,q){const d=q.replace(/\D/g,'');
  if(d&&d.length===q.replace(/\s/g,'').length){return d.length<=p.r.length?p.r.startsWith(d):d.startsWith(p.r);}
  return norm(p.n).includes(q)||p.r.startsWith(q);}
function filtra(){
  const q=norm($('q').value.trim());
  lista=D.p.filter(p=>(fA===''||String(p.a)===fA)&&(!fC||p.c===fC)&&(!soEst||!LOJA||(p.e[LOJA]&&p.e[LOJA][0]>0))&&
    (!q||casa(p,q)));
  lim=60; desenha();
}
function desenha(){
  const g=$('grade');g.innerHTML='';
  const frag=document.createDocumentFragment(); lista.slice(0,lim).forEach(p=>frag.appendChild(cartao(p))); g.appendChild(frag);
  if(!lista.length)g.innerHTML='<div class="vazio">Nenhum produto com esses filtros.</div>';
  $('mais').hidden=lista.length<=lim;
  const na=lista.filter(p=>p.a).length;
  const zr=LOJA?lista.filter(p=>!(p.e[LOJA]&&p.e[LOJA][0]>0)).length:0;
  $('resumo').textContent=`${lista.length} produtos · ${na} na ação · ${lista.length-na} fora`+(LOJA?` · ${zr} zerados na sua loja`:' · escolha sua loja para ver o estoque')+` · ${D.estoque}`;
}
$('mais').onclick=()=>{lim+=60;desenha();};

async function abre(p){
  const es=estoque(p),zero=es&&es.q===0;
  const fb=$('fbox');fb.className='fbox'+(p.a?'':' fora');
  const outras=Object.keys(p.e).filter(k=>k!==LOJA&&p.e[k][0]>0).sort((a,b)=>p.e[b][0]-p.e[a][0]).slice(0,5)
    .map(k=>{const l=D.lojas.find(x=>x.n===k);return (l?l.n+' '+l.nome:k)+' ('+p.e[k][0]+')';});
  fb.innerHTML=`<div class="faixa">${p.a?'✓ PERTENCE À AÇÃO':'✕ NÃO PERTENCE À AÇÃO'}</div>
   <button class="fechar" id="fx" aria-label="Fechar">×</button>
   <div class="ft"><span class="sf" id="fimg">${p.f?'carregando foto…':(p.x?'Esta referência não está na lista oficial da ação.':'sem foto')}</span></div>
   <div class="tx"><span class="nm" id="fnm">${p.n||'Produto sem nome no cadastro'}</span><span class="rf">Referência ${p.r} · ${p.c}</span>
   ${p.pa?`<span class="preco">${p.po>p.pa?`<s>${brl(p.po)}</s> `:''}<b>${brl(p.pa)}</b></span>`:''}
   ${es?(zero?`<div class="est zero">ZERADO NA SUA LOJA</div>`:`<div class="est"><b>${es.q} ${es.q===1?'peça':'peças'} na sua loja</b><div class="tams">Tamanhos: ${es.t||'–'}</div></div>`):`<div class="est">Escolha sua loja no topo para ver o estoque. Rede: ${total(p)} peças.</div>`}
   ${outras.length?`<span class="outras">Tem em: ${outras.join(' · ')}</span>`:''}</div>`;
  $('ficha').hidden=false; $('fx').onclick=fecha; $('fx').focus();
  if(navigator.vibrate)navigator.vibrate(p.a?60:[120,80,120]);
  if(p.f){const s=await foto(p.r);const el=$('fimg');if(el){if(s){const im=new Image();im.src=s;im.alt=p.n;el.replaceWith(im);}else el.textContent='sem foto';}}
}
function fecha(){$('ficha').hidden=true;}
$('ficha').onclick=e=>{if(e.target.id==='ficha')fecha();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});

/* busca por código: o código de barras começa pela referência (5 dígitos) */
function porCodigo(t){
  const d=String(t).replace(/\D/g,''); if(d.length<4)return null;
  return D.p.find(p=>p.r===d)||D.p.find(p=>d.length>=12&&d.startsWith(p.r)&&p.r.length===6)||D.p.find(p=>d.length>=5&&p.r===d.slice(0,5))||(d.length>=5?{r:d.slice(0,5),n:'Referência fora da lista da ação',c:'não está na lista',a:0,f:0,e:{},x:1}:null);
}
function status(t,err){const s=$('status');s.textContent=t||'';s.className='status'+(err?' err':'');}
$('form').onsubmit=e=>{e.preventDefault();const p=porCodigo($('q').value);if(p){abre(p);status('');}else{filtra();}$('q').blur();};
let qT=0;$('q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(filtra,200);});

/* leitura do código de barras pela foto da etiqueta */
let native=null;try{if('BarcodeDetector' in window)native=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','itf']});}catch(e){}
let zxP=null;function loadZX(){if(window.ZXing)return Promise.resolve(true);if(!zxP)zxP=new Promise(ok=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>ok(true);s.onerror=()=>{zxP=null;ok(false);};document.head.appendChild(s);});return zxP;}
function drawTo(im,max,rot){const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h)),W=Math.round(w*s),H=Math.round(h*s);const cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});
  if(rot){cv.width=H;cv.height=W;x.translate(H/2,W/2);x.rotate(Math.PI/2);x.drawImage(im,-W/2,-H/2,W,H);}else{cv.width=W;cv.height=H;x.drawImage(im,0,0,W,H);}return cv;}
function zx(cv){if(!window.ZXing)return null;try{const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);const r=new ZXing.MultiFormatReader();r.setHints(h);return r.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText();}catch(e){return null;}}
async function decodifica(im){if(native){try{const r=await native.detect(im);if(r&&r[0])return r[0].rawValue;}catch(e){}}
  await loadZX();for(const m of [1400,900,2000])for(const rot of [false,true]){const t=zx(drawTo(im,m,rot));if(t)return t;}return null;}
let stream=null,loopId=0,liveOff=!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||window.self!==window.top;
function achou(t){$('q').value=t;const p=porCodigo(t);if(p){status('Código '+t);abre(p);}else status('Não consegui identificar a referência no código '+t+'. Digite a referência.',true);}
async function startLive(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){liveOff=true;status('A câmera não abriu. Toque de novo em "Ler código" para fotografar a etiqueta.',true);return;}
  if(!native)loadZX();const v=$('video');v.srcObject=stream;await v.play().catch(()=>{});$('cam').hidden=false;status('');
  const my=++loopId;let busy=false;
  const tick=async()=>{if(my!==loopId)return;
    if(!busy&&v.videoWidth){busy=true;let t=null;
      if(native){try{const r=await native.detect(v);if(r&&r[0])t=r[0].rawValue;}catch(e){}}
      if(!t){const W=v.videoWidth,H=v.videoHeight,cv=document.createElement('canvas');cv.width=Math.min(1000,W);cv.height=Math.round(cv.width*.4);const sh=W*.4;cv.getContext('2d',{willReadFrequently:true}).drawImage(v,0,(H-sh)/2,W,sh,0,0,cv.width,cv.height);t=zx(cv);}
      busy=false;if(t){stopLive();achou(t);return;}}
    setTimeout(tick,native?120:220);};
  tick();}
function stopLive(){loopId++;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}$('cam').hidden=true;}
$('bStop').onclick=stopLive;
document.querySelector('label[for=file]').addEventListener('click',e=>{if(!liveOff&&D){e.preventDefault();startLive();}});
document.querySelector('label[for=file]').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!D)return;status('Lendo o código de barras…');
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=async()=>{const t=await decodifica(im);URL.revokeObjectURL(url);
    if(!t){status('Não achei o código na foto. Chegue mais perto, com a etiqueta reta e bem iluminada, ou digite a referência.',true);return;}
    $('q').value=t;const p=porCodigo(t);
    if(p){status('Código '+t);abre(p);} else status('Não consegui identificar a referência no código '+t+'. Digite a referência.',true);};
  im.onerror=()=>status('Não consegui abrir a foto.',true);im.src=url;};

/* filtros */
$('fa').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  if(b.id==='soEst'){soEst=!soEst;b.setAttribute('aria-pressed',soEst);if(soEst&&!LOJA)status('Escolha sua loja para filtrar pelo estoque.',true);filtra();return;}
  fA=b.dataset.a;$('fa').querySelectorAll('.chip[data-a]').forEach(c=>c.setAttribute('aria-pressed',c===b));filtra();});
$('fc').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;fC=b.dataset.c;$('fc').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));filtra();});
$('loja').onchange=()=>{LOJA=$('loja').value;try{localStorage.setItem('acao_loja',LOJA);}catch(e){}status('');filtra();};

fetch('dados.json').then(r=>r.json()).then(d=>{D=d;
  const sel=$('loja');d.lojas.forEach(l=>{const o=document.createElement('option');o.value=l.n;o.textContent=l.n+' · '+l.nome;sel.appendChild(o);});
  if(LOJA&&d.lojas.some(l=>l.n===LOJA))sel.value=LOJA;else LOJA='';
  const cats={};d.p.forEach(p=>cats[p.c]=(cats[p.c]||0)+1);
  $('fc').innerHTML='<button class="chip" data-c="" aria-pressed="true">Todas as categorias</button>'+Object.keys(cats).sort((a,b)=>a==='Outros'?1:b==='Outros'?-1:a.localeCompare(b,'pt')).map(c=>`<button class="chip" data-c="${c}" aria-pressed="false">${c} <span style="opacity:.6">${cats[c]}</span></button>`).join('');
  filtra();
}).catch(()=>{$('resumo').textContent='Não consegui carregar a lista de produtos. Recarregue a página.';});
</script>

</body></html>
